# Timonel — foto-only (contrato Timonel)
# Orquestar, no inventar. Un solo comando: docker compose up --build
#
# Perfiles:
#   (default)  hot (~5 paddlex: vehicles, ocr, objects, faces, pose)
#              + adapter + bridge  — plates+text usan paddlex-ocr
#   --profile extended     → pedestrians, scene, open-vocab (signs vía OV)
#   --profile experimental → face-id, scene-cls, instances, small-objects, anomaly
#   --profile legacy-signs → paddlex-signs :8088 (rollback COCO)
#   --profile demo         → bridge en DEMO_MODE (sin fotos/GPU)
#   --profile rules        → JetLinks opcional
#   --profile gpu          → PaddleX con runtime NVIDIA (requiere NVIDIA Container Toolkit)
#
# RAM (mem_limit por contenedor paddlex):
#   Techo ~2g por contenedor (x-limits-paddlex). Default pensado para CPU.
#   Si un servicio OOMKilled, subí su mem_limit o bajá BRIDGE_MAX_WIDTH.
#
# Layout: detection/* + bridge + adapter. Ver README.md (activo vs activable).

name: timonel

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-paddlex-build: &paddlex-build
  context: .
  dockerfile: infra/Dockerfile.paddlex
  args:
    BASE_IMAGE: ${PADDLE_BASE_IMAGE:-paddlepaddle/paddle:3.0.0}

# Techo por contenedor paddlex (~2g). Sin cpus: — el kernel reparte entre servicios.
x-limits-paddlex: &limits-paddlex
  mem_limit: 2000m
  mem_reservation: 512m

x-paddlex-health: &paddlex-health
  interval: 30s
  timeout: 10s
  retries: 20
  start_period: 300s

x-paddlex-cpu: &paddlex-cpu
  build: *paddlex-build
  restart: unless-stopped
  networks:
    - timonel-network
  logging: *default-logging

networks:
  timonel-network:
    name: timonel-network
    external: true

services:
  paddlex:
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex:local
    container_name: tm-paddlex
    ports:
      - "${PADDLEX_PORT:-8080}:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/docs || curl -fsS http://127.0.0.1:8080/openapi.json || exit 1"]
      <<: *paddlex-health

  paddlex-ocr:
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-ocr:local
    container_name: tm-paddlex-ocr
    ports:
      - "${PADDLEX_OCR_PORT:-8081}:8081"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=${OCR_PIPELINE_CONFIG:-/opt/paddlex/pipelines/ocr_v5_mobile.yaml}
      - TIMONEL_PORT=8081
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-ocr-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/docs || curl -fsS http://127.0.0.1:8081/openapi.json || exit 1"]
      <<: *paddlex-health

  # Object detection COCO (person, dog, …). Merge en detection/objects.

  paddlex-objects:
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-objects:local
    container_name: tm-paddlex-objects
    ports:
      - "${PADDLEX_OBJECTS_PORT:-8082}:8082"
    environment:
      - PYTHONUNBUFFERED=1
      # YAML local: PP-YOLOE_plus-S en vez del PicoDet-S default (ver pipeline.yaml)
      - TIMONEL_PIPELINE=/opt/paddlex/pipelines/object_detection.yaml
      - TIMONEL_PORT=8082
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-objects-models:/root/.paddlex
      - ./detection/objects/pipeline.yaml:/opt/paddlex/pipelines/object_detection.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/docs || curl -fsS http://127.0.0.1:8082/openapi.json || exit 1"]
      <<: *paddlex-health

  paddlex-faces:
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-faces:local
    container_name: tm-paddlex-faces
    ports:
      - "${PADDLEX_FACES_PORT:-8083}:8083"
    environment:
      - PYTHONUNBUFFERED=1
      # PaddleX 3.7 no tiene pipeline face_detection; YAML local → /object-detection
      - TIMONEL_PIPELINE=/opt/paddlex/pipelines/face_detection.yaml
      - TIMONEL_PORT=8083
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-faces-models:/root/.paddlex
      - ./detection/faces/pipeline.yaml:/opt/paddlex/pipelines/face_detection.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/docs || curl -fsS http://127.0.0.1:8083/openapi.json || exit 1"]
      <<: *paddlex-health

  # Opt-in: docker compose --profile extended up …
  paddlex-pedestrians:
    profiles: ["extended"]
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-pedestrians:local
    container_name: tm-paddlex-pedestrians
    ports:
      - "${PADDLEX_PEDESTRIANS_PORT:-8084}:8084"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=pedestrian_attribute_recognition
      - TIMONEL_PORT=8084
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-pedestrians-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/docs || curl -fsS http://127.0.0.1:8084/openapi.json || exit 1"]
      <<: *paddlex-health

  # Opt-in: docker compose --profile extended up …
  paddlex-scene:
    profiles: ["extended"]
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-scene:local
    container_name: tm-paddlex-scene
    ports:
      - "${PADDLEX_SCENE_PORT:-8085}:8085"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=${SCENE_PIPELINE_CONFIG:-semantic_segmentation}
      - TIMONEL_PORT=8085
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-scene-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/docs || curl -fsS http://127.0.0.1:8085/openapi.json || exit 1"]
      <<: *paddlex-health

  paddlex-pose:
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-pose:local
    container_name: tm-paddlex-pose
    ports:
      - "${PADDLEX_POSE_PORT:-8086}:8086"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=human_keypoint_detection
      - TIMONEL_PORT=8086
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-pose-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/docs || curl -fsS http://127.0.0.1:8086/openapi.json || exit 1"]
      <<: *paddlex-health

  # Opt-in: docker compose --profile experimental up …
  paddlex-face-id:
    profiles: ["experimental"]
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-face-id:local
    container_name: tm-paddlex-face-id
    ports:
      - "${PADDLEX_FACE_ID_PORT:-8087}:8087"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=face_recognition
      - TIMONEL_PORT=8087
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-face-id-models:/root/.paddlex
      # Hot-patch: FaissBuilder (N,1,D)→(N,D). Bake-in: Dockerfile.paddlex.
      - ./infra/patches/paddlex_faisser.py:/usr/local/lib/python3.10/dist-packages/paddlex/inference/pipelines/components/faisser.py:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8087/docs || curl -fsS http://127.0.0.1:8087/openapi.json || exit 1"]
      <<: *paddlex-health

  # Legacy COCO signs (:8088). Opt-in: docker compose --profile legacy-signs up paddlex-signs
  # Producto usa paddlex-open-vocab :8093 (SIGNS_BACKEND=ov). Ver detection/signs/README.
  paddlex-signs:
    profiles: ["legacy-signs"]
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-signs:local
    container_name: tm-paddlex-signs
    ports:
      - "${PADDLEX_SIGNS_PORT:-8088}:8088"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=object_detection
      - TIMONEL_PORT=8088
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-signs-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/docs || curl -fsS http://127.0.0.1:8088/openapi.json || exit 1"]
      <<: *paddlex-health

  # Opt-in: docker compose --profile experimental up …
  paddlex-scene-cls:
    profiles: ["experimental"]
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-scene-cls:local
    container_name: tm-paddlex-scene-cls
    ports:
      - "8089:8089"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=image_classification
      - TIMONEL_PORT=8089
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-scene-cls-models:/root/.paddlex
      # Hotfix PaddleX 3.7.2 class_ids shape bug (also baked into Dockerfile).
      - ./infra/patches/paddlex_image_classification.py:/usr/local/lib/python3.10/dist-packages/paddlex/inference/serving/basic_serving/_pipeline_apps/image_classification.py:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8089/docs || curl -fsS http://127.0.0.1:8089/openapi.json || exit 1"]
      <<: *paddlex-health

  # Opt-in: docker compose --profile experimental up …
  paddlex-instances:
    profiles: ["experimental"]
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-instances:local
    container_name: tm-paddlex-instances
    ports:
      - "8090:8090"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=instance_segmentation
      - TIMONEL_PORT=8090
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-instances-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/docs || curl -fsS http://127.0.0.1:8090/openapi.json || exit 1"]
      <<: *paddlex-health

  # Opt-in: docker compose --profile experimental up … (preferí ENABLE_INFER_TILING)
  paddlex-small-objects:
    profiles: ["experimental"]
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-small-objects:local
    container_name: tm-paddlex-small-objects
    ports:
      - "8091:8091"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=small_object_detection
      - TIMONEL_PORT=8091
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-small-objects-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/docs || curl -fsS http://127.0.0.1:8091/openapi.json || exit 1"]
      <<: *paddlex-health

  # Opt-in: docker compose --profile experimental up …
  paddlex-anomaly:
    profiles: ["experimental"]
    <<: [*paddlex-cpu, *limits-paddlex]
    image: timonel/paddlex-anomaly:local
    container_name: tm-paddlex-anomaly
    ports:
      - "8092:8092"
    environment:
      - PYTHONUNBUFFERED=1
      - TIMONEL_PIPELINE=anomaly_detection
      - TIMONEL_PORT=8092
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-anomaly-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8092/docs || curl -fsS http://127.0.0.1:8092/openapi.json || exit 1"]
      <<: *paddlex-health

  # Opt-in: docker compose --profile extended up … (también sirve signs vía OV)
  paddlex-open-vocab:
    profiles: ["extended"]
    <<: [*limits-paddlex]
    build:
      context: .
      dockerfile: infra/Dockerfile.paddlex
      args:
        BASE_IMAGE: ${PADDLE_BASE_IMAGE:-paddlepaddle/paddle:3.0.0}
        PADDLEX_EXTRAS: cv,serving,ocr,multimodal
    image: timonel/paddlex-open-vocab:local
    container_name: tm-paddlex-open-vocab
    restart: unless-stopped
    networks:
      - timonel-network
    logging: *default-logging
    ports:
      - "8093:8093"
    environment:
      - PYTHONUNBUFFERED=1
      # YOLO-Worldv2-L: GroundingDINO-T 500 reshape en paddle 3.0.0 CPU.
      - TIMONEL_PIPELINE=/opt/paddlex/pipelines/open_vocab_yoloworld.yaml
      - TIMONEL_PORT=8093
      - TIMONEL_USE_HPIP=${TIMONEL_USE_HPIP:-0}
    volumes:
      - paddlex-open-vocab-models:/root/.paddlex
      - ./detection/open_vocab/pipeline.yaml:/opt/paddlex/pipelines/open_vocab_yoloworld.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8093/docs || curl -fsS http://127.0.0.1:8093/openapi.json || exit 1"]
      <<: *paddlex-health


  paddlex-gpu:
    profiles: ["gpu"]
    <<: *limits-paddlex
    build:
      context: .
      dockerfile: infra/Dockerfile.paddlex
      args:
        BASE_IMAGE: ${PADDLE_GPU_BASE_IMAGE:-paddlepaddle/paddle:3.0.0-gpu-cuda11.8-cudnn8.9-trt8.6}
        DEVICE: gpu
    image: timonel/paddlex-gpu:local
    container_name: tm-paddlex-gpu
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "${PADDLEX_PORT:-8080}:8080"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
      - TIMONEL_DEVICE=gpu
    volumes:
      - paddlex-models:/root/.paddlex
    networks:
      - timonel-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/docs || curl -fsS http://127.0.0.1:8080/openapi.json || exit 1"]
      <<: *paddlex-health
    logging: *default-logging

  adapter:
    build:
      context: .
      dockerfile: adapter/Dockerfile
    image: timonel/adapter:local
    container_name: tm-adapter
    restart: unless-stopped
    ports:
      - "${ADAPTER_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TRACK_TTL_SECONDS=${TRACK_TTL_SECONDS:-10}
      - MAX_DETECTIONS_PER_TRACK=${MAX_DETECTIONS_PER_TRACK:-60}
      - EVENTS_BUFFER_SIZE=${EVENTS_BUFFER_SIZE:-500}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - IDENTITY_HASH_SALT=${IDENTITY_HASH_SALT:-}
      - JETLINKS_WEBHOOK_URL=${JETLINKS_WEBHOOK_URL:-}
      - JETLINKS_API_KEY=${JETLINKS_API_KEY:-demo}
      - RULES_SINK_URL=${RULES_SINK_URL:-http://rules-sink:8850}
      - TIMONEL_ENV=${TIMONEL_ENV:-development}
      - STATIC_DIR=/app/adapter/ui
      - PYTHONPATH=/app
      - MEDIA_DIR=${MEDIA_DIR:-/media}
      - MEDIA_POLL_INTERVAL=${MEDIA_POLL_INTERVAL:-1.0}
      - MEDIA_WATCH_INTERVAL=${MEDIA_WATCH_INTERVAL:-1.0}
      - PREVIEW_MJPEG_INTERVAL=${PREVIEW_MJPEG_INTERVAL:-0.05}
      # Mirror SPA-relevant ENABLE_* onto adapter (same defaults as bridge).
      # vehicle/object always available in adapter code (no ENABLE needed).
      # Hot path ON: faces, pose, scene OCR. Opt-in OFF: rest (need profile + flag).
      - ENABLE_FACE_DETECTION=${ENABLE_FACE_DETECTION:-true}
      - ENABLE_SCENE_SEG=${ENABLE_SCENE_SEG:-false}
      - ENABLE_POSE=${ENABLE_POSE:-true}
      - ENABLE_SCENE_OCR=${ENABLE_SCENE_OCR:-true}
      - ENABLE_FACE_ID=${ENABLE_FACE_ID:-false}
      - ENABLE_SIGNS=${ENABLE_SIGNS:-false}
      - ENABLE_SCENE_CLS=${ENABLE_SCENE_CLS:-false}
      - ENABLE_INSTANCE_SEG=${ENABLE_INSTANCE_SEG:-false}
      - ENABLE_SMALL_OBJECTS=${ENABLE_SMALL_OBJECTS:-false}
      - ENABLE_ANOMALY=${ENABLE_ANOMALY:-false}
      - ENABLE_OPEN_VOCAB=${ENABLE_OPEN_VOCAB:-false}
      # available = ENABLE_* AND health HTTP de paddlex (TTL 15s).
      - CAPABILITY_HEALTH_CHECK=${CAPABILITY_HEALTH_CHECK:-true}
      - PADDLEX_URL=${PADDLEX_URL:-http://paddlex:8080}
      - PADDLEX_OBJECTS_URL=${PADDLEX_OBJECTS_URL:-http://paddlex-objects:8082}
      - PADDLEX_OCR_URL=${PADDLEX_OCR_URL:-http://paddlex-ocr:8081}
      - PADDLEX_FACES_URL=${PADDLEX_FACES_URL:-http://paddlex-faces:8083}
      - PADDLEX_SCENE_URL=${PADDLEX_SCENE_URL:-http://paddlex-scene:8085}
      - PADDLEX_POSE_URL=${PADDLEX_POSE_URL:-http://paddlex-pose:8086}
      - PADDLEX_FACE_ID_URL=${PADDLEX_FACE_ID_URL:-http://paddlex-face-id:8087}
      - PADDLEX_OPEN_VOCAB_URL=${PADDLEX_OPEN_VOCAB_URL:-http://paddlex-open-vocab:8093}
      - PADDLEX_SIGNS_OV_URL=${PADDLEX_SIGNS_OV_URL:-http://paddlex-open-vocab:8093}
      - PADDLEX_SCENE_CLS_URL=${PADDLEX_SCENE_CLS_URL:-http://paddlex-scene-cls:8089}
      - PADDLEX_INSTANCES_URL=${PADDLEX_INSTANCES_URL:-http://paddlex-instances:8090}
      - PADDLEX_SMALL_OBJECTS_URL=${PADDLEX_SMALL_OBJECTS_URL:-http://paddlex-small-objects:8091}
      - PADDLEX_ANOMALY_URL=${PADDLEX_ANOMALY_URL:-http://paddlex-anomaly:8092}
    volumes:
      - ./imagenes_muestra:/media/images
    networks:
      - timonel-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    image: timonel/bridge:local
    container_name: tm-bridge
    restart: unless-stopped
    depends_on:
      adapter:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - MEDIA_DIR=${MEDIA_DIR:-/media}
      - MEDIA_POLL_INTERVAL=${MEDIA_POLL_INTERVAL:-1.0}
      - ADAPTER_INGEST_URL=${ADAPTER_INGEST_URL:-http://adapter:8000/ingest}
      - ADAPTER_MEDIA_CURRENT_URL=${ADAPTER_MEDIA_CURRENT_URL:-http://adapter:8000/media/current}
      - ADAPTER_PREVIEW_FRAME_URL=${ADAPTER_PREVIEW_FRAME_URL:-http://adapter:8000/preview/frame}
      - ADAPTER_CAPABILITIES_URL=${ADAPTER_CAPABILITIES_URL:-http://adapter:8000/capabilities}
      - PADDLEX_URL=${PADDLEX_URL:-http://paddlex:8080}
      - PADDLEX_PREDICT_PATH=${PADDLEX_PREDICT_PATH:-/vehicle-attribute-recognition}
      - BRIDGE_FPS=${BRIDGE_FPS:-1}
      - BRIDGE_MAX_WIDTH=${BRIDGE_MAX_WIDTH:-1920}
      - ENABLE_INFER_TILING=${ENABLE_INFER_TILING:-false}
      - INFER_SLICE_WH=${INFER_SLICE_WH:-640}
      - INFER_OVERLAP_WH=${INFER_OVERLAP_WH:-100}
      - INFER_TILE_THREAD_WORKERS=${INFER_TILE_THREAD_WORKERS:-1}
      - CROSS_CAP_NMS_THRESHOLD=${CROSS_CAP_NMS_THRESHOLD:-0.5}
      - TIMONEL_ZONES_JSON=${TIMONEL_ZONES_JSON:-}
      - JPEG_QUALITY=${JPEG_QUALITY:-80}
      - DEMO_MODE=${DEMO_MODE:-0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-30}
      - PADDLEX_OCR_URL=${PADDLEX_OCR_URL:-http://paddlex-ocr:8081}
      - PADDLEX_OBJECTS_URL=${PADDLEX_OBJECTS_URL:-http://paddlex-objects:8082}
      - PADDLEX_OBJECTS_PREDICT_PATH=${PADDLEX_OBJECTS_PREDICT_PATH:-/object-detection}
      - ENABLE_PLATE_OCR=${ENABLE_PLATE_OCR:-true}
      - OCR_MIN_SCORE=${OCR_MIN_SCORE:-0.7}
      - OCR_EVERY_N_FRAMES=${OCR_EVERY_N_FRAMES:-5}
      - OCR_TOPK=${OCR_TOPK:-3}
      - OCR_HTTP_TIMEOUT=${OCR_HTTP_TIMEOUT:-5}
      - PADDLEX_FACES_URL=${PADDLEX_FACES_URL:-http://paddlex-faces:8083}
      # Faces usa YAML custom con pipeline object_detection → endpoint /object-detection
      - PADDLEX_FACES_PREDICT_PATH=${PADDLEX_FACES_PREDICT_PATH:-/object-detection}
      - ENABLE_FACE_DETECTION=${ENABLE_FACE_DETECTION:-true}
      - PADDLEX_PEDESTRIANS_URL=${PADDLEX_PEDESTRIANS_URL:-http://paddlex-pedestrians:8084}
      - PADDLEX_PEDESTRIANS_PREDICT_PATH=${PADDLEX_PEDESTRIANS_PREDICT_PATH:-/pedestrian-attribute-recognition}
      - ENABLE_PEDESTRIAN_ATTRS=${ENABLE_PEDESTRIAN_ATTRS:-false}
      - PADDLEX_SCENE_URL=${PADDLEX_SCENE_URL:-http://paddlex-scene:8085}
      - PADDLEX_SCENE_PREDICT_PATH=${PADDLEX_SCENE_PREDICT_PATH:-/semantic-segmentation}
      - ENABLE_SCENE_SEG=${ENABLE_SCENE_SEG:-false}
      - SCENE_LABEL_MODE=${SCENE_LABEL_MODE:-cityscapes}
      - CROSSWALK_MIN_RATIO=${CROSSWALK_MIN_RATIO:-0.01}
      - ENABLE_POSE=${ENABLE_POSE:-true}
      - PADDLEX_POSE_URL=${PADDLEX_POSE_URL:-http://paddlex-pose:8086}
      - ENABLE_SCENE_OCR=${ENABLE_SCENE_OCR:-true}
      - SCENE_OCR_MIN_SCORE=${SCENE_OCR_MIN_SCORE:-0.5}
      - SCENE_OCR_MAX_LINES=${SCENE_OCR_MAX_LINES:-20}
      - ENABLE_FACE_ID=${ENABLE_FACE_ID:-false}
      - PADDLEX_FACE_ID_URL=${PADDLEX_FACE_ID_URL:-http://paddlex-face-id:8087}
      - FACE_ID_INDEX_KEY=${FACE_ID_INDEX_KEY:-}
      - ENABLE_SIGNS=${ENABLE_SIGNS:-false}
      # Producto: YOLO-World vía open-vocab (profile extended). Legacy COCO: SIGNS_BACKEND=coco + profile legacy-signs.
      - SIGNS_BACKEND=${SIGNS_BACKEND:-ov}
      - PADDLEX_SIGNS_OV_URL=${PADDLEX_SIGNS_OV_URL:-http://paddlex-open-vocab:8093}
      - PADDLEX_SIGNS_OV_PREDICT_PATH=${PADDLEX_SIGNS_OV_PREDICT_PATH:-/open-vocabulary-detection}
      - SIGNS_OV_PROMPT=${SIGNS_OV_PROMPT:-traffic sign,stop sign,traffic light}
      - SIGNS_OV_THRESHOLD=${SIGNS_OV_THRESHOLD:-0.05}
      - PADDLEX_SIGNS_URL=${PADDLEX_SIGNS_URL:-http://paddlex-signs:8088}
      - SIGNS_LABELS=${SIGNS_LABELS:-}
      - SIGNS_THRESHOLD=${SIGNS_THRESHOLD:-0.1}
      - ENABLE_SCENE_CLS=${ENABLE_SCENE_CLS:-false}
      - PADDLEX_SCENE_CLS_URL=${PADDLEX_SCENE_CLS_URL:-http://paddlex-scene-cls:8089}
      - ENABLE_INSTANCE_SEG=${ENABLE_INSTANCE_SEG:-false}
      - PADDLEX_INSTANCES_URL=${PADDLEX_INSTANCES_URL:-http://paddlex-instances:8090}
      - ENABLE_SMALL_OBJECTS=${ENABLE_SMALL_OBJECTS:-false}
      - PADDLEX_SMALL_OBJECTS_URL=${PADDLEX_SMALL_OBJECTS_URL:-http://paddlex-small-objects:8091}
      - ENABLE_ANOMALY=${ENABLE_ANOMALY:-false}
      - PADDLEX_ANOMALY_URL=${PADDLEX_ANOMALY_URL:-http://paddlex-anomaly:8092}
      - ENABLE_OPEN_VOCAB=${ENABLE_OPEN_VOCAB:-false}
      - PADDLEX_OPEN_VOCAB_URL=${PADDLEX_OPEN_VOCAB_URL:-http://paddlex-open-vocab:8093}
      # Cascada: ped←person; face_id←face; open_vocab en oleada 1 (cola larga).
      # faces/pose/signs siguen en oleada 1 (sin trigger) hasta medir recall.
      - ENABLE_EVIDENCE_CASCADE=${ENABLE_EVIDENCE_CASCADE:-true}
      - CASCADE_OBJECT_LOW_SCORE=${CASCADE_OBJECT_LOW_SCORE:-0.35}
      # Fase 2 lifecycle: pause ped/face_id en idle; unpause en oleada 2.
      # Opt-in (docker.sock). open_vocab no se pausa (compartido con signs).
      - ENABLE_CONTAINER_LIFECYCLE=${ENABLE_CONTAINER_LIFECYCLE:-false}
      - CONTAINER_IDLE_PAUSE_S=${CONTAINER_IDLE_PAUSE_S:-120}
      - DOCKER_SOCK=${DOCKER_SOCK:-/var/run/docker.sock}
      - LIFECYCLE_PAUSE_CAPS=${LIFECYCLE_PAUSE_CAPS:-}
      # Sin "traffic sign": ownership exclusiva de la capacidad signs.
      - OPEN_VOCAB_PROMPT=${OPEN_VOCAB_PROMPT:-person,car}
      - OPEN_VOCAB_THRESHOLD=${OPEN_VOCAB_THRESHOLD:-0.05}
    volumes:
      - ./detection:/app/detection:ro
      - ./bridge:/app/bridge:ro
      - ./imagenes_muestra:/media/images:ro
      # Solo usado si ENABLE_CONTAINER_LIFECYCLE=true (pause/unpause).
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - timonel-network
    logging: *default-logging

  bridge-demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: bridge/Dockerfile
    image: timonel/bridge:local
    container_name: tm-bridge-demo
    restart: unless-stopped
    depends_on:
      adapter:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - ADAPTER_INGEST_URL=http://adapter:8000/ingest
      - DEMO_MODE=1
      - BRIDGE_FPS=1
      - LOG_LEVEL=INFO
    networks:
      - timonel-network
    logging: *default-logging

  jetlinks:
    profiles: ["rules"]
    image: jetlinks/jetlinks-standalone:latest
    container_name: tm-jetlinks
    restart: unless-stopped
    ports:
      - "${JETLINKS_PORT:-8848}:8848"
    environment:
      - JAVA_OPTS=-Xmx512m
    networks:
      - timonel-network
    logging: *default-logging

  rules-sink:
    profiles: ["rules"]
    build:
      context: .
      dockerfile: rules/Dockerfile
    image: timonel/rules-sink:local
    container_name: tm-rules-sink
    restart: unless-stopped
    ports:
      - "${RULES_SINK_PORT:-8850}:8850"
    environment:
      - PYTHONPATH=/app
      - RULES_SINK_API_KEY=${RULES_SINK_API_KEY:-demo}
      - RULES_SINK_MAX_ALERTS=${RULES_SINK_MAX_ALERTS:-100}
      - TIMONEL_ENV=${TIMONEL_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./rules:/app/rules
    networks:
      - timonel-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8850/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

volumes:
  paddlex-models:
    name: tm-paddlex-models
  paddlex-ocr-models:
    name: tm-paddlex-ocr-models
  paddlex-objects-models:
    name: tm-paddlex-objects-models
  paddlex-faces-models:
    name: tm-paddlex-faces-models
  paddlex-pedestrians-models:
    name: tm-paddlex-pedestrians-models
  paddlex-scene-models:
    name: tm-paddlex-scene-models
  paddlex-pose-models:
    name: tm-paddlex-pose-models
  paddlex-face-id-models:
    name: tm-paddlex-face-id-models
  paddlex-signs-models:
    name: tm-paddlex-signs-models
  paddlex-scene-cls-models:
    name: tm-paddlex-scene-cls-models
  paddlex-instances-models:
    name: tm-paddlex-instances-models
  paddlex-small-objects-models:
    name: tm-paddlex-small-objects-models
  paddlex-anomaly-models:
    name: tm-paddlex-anomaly-models
  paddlex-open-vocab-models:
    name: tm-paddlex-open-vocab-models
