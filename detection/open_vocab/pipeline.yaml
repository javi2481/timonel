# Default open_vocab en CPU (paddle 3.0.0).
# GroundingDINO-T (default upstream PaddleX) falla en infer con
# RuntimeError: could not reshape a memory descriptor (static runner / OneDNN).
# YOLO-Worldv2-L verifica OK en el mismo stack CPU.
#
# Docs: https://paddlepaddle.github.io/PaddleX/3.7/en/pipeline_usage/tutorials/cv_pipelines/open_vocabulary_detection.html

pipeline_name: open_vocabulary_detection

SubModules:
  OpenVocabularyDetection:
    module_name: open_vocabulary_detection
    model_name: YOLO-Worldv2-L
    model_dir: null
    batch_size: 1
    thresholds:
      # YOLO-Worldv2-L en CPU: 0.3 casi no dispara; 0.05 mide hits en fo_pedestrians.
      threshold: 0.05
