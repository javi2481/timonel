# Pipeline object_detection del producto (servicio paddlex-objects, :8082).
#
# PP-YOLOE_plus-S en lugar del PicoDet-S que trae el pipeline object_detection
# por defecto: A/B medido con scripts/eval_paddlex_fixtures.py --only objects
# (recall 0.386 -> 0.604 direct, 0.386 -> 0.574 vía bridge, precisión estable).
# PP-YOLOE_plus-L da +0.09 de recall pero ~3.5x wall y ~2x RAM: queda como
# escalada opt-in en docker-compose.objects-yoloe-exp.yml.
#
# Docs: https://paddlepaddle.github.io/PaddleX/3.7/en/pipeline_usage/tutorials/cv_pipelines/object_detection.html

pipeline_name: object_detection

SubModules:
  ObjectDetection:
    module_name: object_detection
    model_name: PP-YOLOE_plus-S
    model_dir: null
    batch_size: 1
    img_size: null
    threshold: null
